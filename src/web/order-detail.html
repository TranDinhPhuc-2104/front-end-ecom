<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chi tiết đơn hàng - Furnish</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../assets/furnish-assets/scss/style.scss">
</head>

<body class="font-sans text-gray-800 d-flex flex-column min-vh-100 bg-light">

    <nav class="navbar navbar-expand-lg bg-white shadow-sm px-4 py-3 navbar-custom">
        <div class="container-fluid px-0">
            <a class="navbar-brand" href="index.html">
                <span class="d-flex flex-column text-uppercase text-xs fw-bold lh-sm">
                    <span class="" style="letter-spacing: .12rem;">Furnish</span>
                    <span>Template</span>
                </span></a>

            <div class="mx-auto d-lg-block d-none">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About us</a></li>
                    <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
                </ul>
            </div>

            <div class="d-flex align-items-center gap-4">
                <span id="nav-greeting" class="fw-bold text-success d-none" style="font-size: 0.95rem;"></span>

                <a href="cart.html" class="text-dark position-relative me-2 text-decoration-none">
                    <i class="bi bi-cart fs-5"></i>
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                        id="cart-badge" style="font-size: 0.65rem;">0</span>
                </a>

                <div class="dropdown">
                    <a class="text-dark-hover" href="#" role="button" id="navbarDropdownMenu" data-bs-toggle="dropdown"
                        aria-expanded="false">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor"
                            class="bi bi-list" viewBox="0 0 16 16">
                            <path fill-rule="evenodd"
                                d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5" />
                        </svg>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end shadow border-0 mt-2"
                        aria-labelledby="navbarDropdownMenu">
                        <li><a class="dropdown-item py-2" href="profile.html">My Profile</a></li>

                        <li><a class="dropdown-item py-2" href="my-orders.html">My Orders</a></li>

                        <li>
                            <hr class="dropdown-divider">
                        </li>

                        <li><a class="dropdown-item py-2" id="auth-link" href="#">Login</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1 py-5">
        <div class="container">
            <div class="mb-4">
                <a href="my-orders.html" class="text-decoration-none text-muted mb-3 d-inline-block">
                    <i class="bi bi-arrow-left me-1"></i> Quay lại lịch sử đơn hàng
                </a>
                <h2 class="display-6 fw-bold text-dark">
                    Chi tiết đơn hàng <span class="text-primary">#<span id="display-order-id">...</span></span>
                </h2>
            </div>

            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table align-middle table-hover mb-0">
                            <thead class="table-light text-muted small text-uppercase">
                                <tr>
                                    <th class="ps-4 py-3">Sản phẩm</th>
                                    <th class="py-3 text-center">Đơn giá</th>
                                    <th class="py-3 text-center">Số lượng</th>
                                    <th class="pe-4 py-3 text-end">Thành tiền</th>
                                </tr>
                            </thead>
                            <tbody id="detail-tbody">
                                <tr>
                                    <td colspan="4" class="text-center py-5 text-muted">
                                        <div class="spinner-border spinner-border-sm text-primary me-2" role="status">
                                        </div>
                                        Đang tải dữ liệu sản phẩm...
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <div class="card-footer bg-white border-top py-4 px-4 text-end">
                    <h5 class="fw-bold mb-0">
                        <span class="text-muted fw-normal me-3">Tổng cộng:</span>
                        <span class="text-danger fs-3" id="display-total-price">$0</span>
                    </h5>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark pt-4 pb-4 mt-auto">
        <div class="container text-center">
            <p class="mb-0 text-white-50 small">&copy; 2026 Furnish. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module">
        import { orderService, authService, uiHelper } from '../services/index.js';

        document.addEventListener("DOMContentLoaded", () => {
            if (!authService.isUserLoggedIn()) {
                alert("Vui lòng đăng nhập để xem chi tiết đơn hàng!");
                window.location.href = "login.html";
                return;
            }

            uiHelper.initCustomerNavbar();

            // Lấy ID từ URL (VD: order-detail.html?id=14)
            const urlParams = new URLSearchParams(window.location.search);
            const orderId = urlParams.get("id");

            if (orderId) {
                document.getElementById("display-order-id").innerText = orderId;
                loadOrderDetails(orderId);
            } else {
                document.getElementById("detail-tbody").innerHTML = `
                <tr><td colspan="4" class="text-center py-5 text-danger fw-bold">Không tìm thấy mã đơn hàng hợp lệ!</td></tr>
            `;
            }
        });

        async function loadOrderDetails(orderId) {
            const tbody = document.getElementById("detail-tbody");

            try {
                const data = await orderService.getOrderDetail(orderId);
                const detailsList = data?.result || (Array.isArray(data) ? data : []);

                if (detailsList.length === 0) {
                    tbody.innerHTML =
                        `<tr><td colspan="4" class="text-center py-5 text-muted">Không có sản phẩm nào trong đơn hàng này.</td></tr>`;
                    return;
                }

                let html = "";
                let grandTotal = 0;

                detailsList.forEach(item => {
                    const name = item.namePro || "Sản phẩm không tên";
                    const productId = item.idProduct || 'N/A';

                    const price = Number(item.price) || 0;
                    const qty = Number(item.quantity) || 1;
                    const subtotal = price * qty;

                    grandTotal += subtotal;

                    const imgUrl = item.image ?
                        `../assets/furnish-assets/images/${item.image}` :
                        `../assets/furnish-assets/images/product-img-1.jpg`;

                    html += `
                    <tr>
                        <td class="ps-4 py-3">
                            <div class="d-flex align-items-center gap-3">
                                <img src="${imgUrl}" style="width: 70px; height: 70px; object-fit: cover;" class="rounded shadow-sm">
                                <div>
                                    <h6 class="mb-1 fw-bold text-dark">${name}</h6>
                                    <small class="text-muted">ID Sản phẩm: ${productId}</small>
                                </div>
                            </div>
                        </td>
                        <td class="py-3 text-center text-muted fw-medium">$${price.toLocaleString('vi-VN')}</td>
                        <td class="py-3 text-center fw-bold text-dark">x${qty}</td>
                        <td class="pe-4 py-3 text-end fw-bold text-danger">$${subtotal.toLocaleString('vi-VN')}</td>
                    </tr>
                `;
                });

                tbody.innerHTML = html;
                document.getElementById("display-total-price").innerText = `$${grandTotal.toLocaleString('vi-VN')}`;

            } catch (error) {
                console.error("Lỗi xem chi tiết:", error);
                tbody.innerHTML =
                    `<tr><td colspan="4" class="text-center py-5 text-danger">Có lỗi xảy ra khi kết nối máy chủ API!</td></tr>`;
            }
        }
    </script>
</body>

</html>
