<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders Management | Dasher</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

    <style>
        body {
            background-color: #f8f9fa;
        }

        /* Cấu trúc Layout Admin */
        #wrapper {
            display: flex;
            width: 100%;
            align-items: stretch;
            min-height: 100vh;
        }

        #sidebar {
            min-width: 250px;
            max-width: 250px;
            background: #fff;
            border-right: 1px solid #eee;
        }

        #content {
            width: 100%;
            padding-bottom: 20px;
        }

        @media (max-width: 991.98px) {
            #sidebar {
                position: fixed;
                left: -250px;
                top: 0;
                bottom: 0;
                z-index: 1045;
                height: 100vh;
                transition: left 0.3s ease;
            }

            #sidebar.show {
                left: 0;
                display: block !important;
            }

            .sidebar-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0, 0, 0, 0.4);
                z-index: 1040;
            }

            .sidebar-overlay.show {
                display: block;
            }
        }

        .card {
            border: none;
            border-radius: 0.75rem;
        }
    </style>
</head>

<body>
    <div id="wrapper">
        <nav id="sidebar" class="p-3 d-none d-lg-block shadow-sm">
            <h4 class="text-primary fw-bold mb-4">
                <a href="index.html" style="text-decoration: none; color: inherit;">Dasher.</a>
            </h4>
            <ul class="nav flex-column gap-2">
                <li class="nav-item"><a class="nav-link text-secondary" href="index.html"><i
                            class="ti ti-dashboard me-2"></i>Dashboard</a></li>
                <li class="nav-item"><a class="nav-link text-secondary" href="product.html"><i
                            class="ti ti-box me-2"></i>Products</a></li>
                <li class="nav-item"><a class="nav-link text-dark fw-semibold" href="orders.html"><i
                            class="ti ti-shopping-cart me-2"></i>Orders</a></li>
                <li class="nav-item"><a class="nav-link text-secondary" href="category.html"><i
                            class="ti ti-category me-2"></i>Categories</a></li>
                <li class="nav-item"><a class="nav-link text-secondary" href="revenue.html"><i
                            class="ti ti-chart-bar me-2"></i>Revenue</a></li>
                <li>
                    <hr class="my-2 text-secondary opacity-25">
                </li>
                <li class="nav-item"><a class="nav-link text-success fw-semibold d-flex align-items-center gap-1"
                        href="../web/index.html"><i class="ti ti-arrow-left me-1"></i>Back to Shop</a></li>
            </ul>
        </nav>

        <div id="content" class="position-relative h-100">
            <header class="d-flex justify-content-between align-items-center bg-white p-3 mb-4 shadow-sm">
                <button class="btn btn-light d-lg-none"><i class="ti ti-menu-2"></i></button>
                <div class="ms-auto">
                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle d-flex align-items-center gap-2" type="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="ti ti-user-circle fs-4"></i>
                            <span class="fw-semibold">Admin Profile</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow">
                            <li>
                                <a class="dropdown-item d-flex align-items-center gap-2 text-danger" href="#"
                                    onclick="localStorage.removeItem('accessToken'); localStorage.removeItem('token'); localStorage.removeItem('idAccount'); window.location.href='authentication/sign-in.html'; return false;">
                                    <i class="ti ti-logout fs-5"></i> Logout
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </header>

            <div class="container-fluid px-4 px-lg-6 py-4">

                <div class="row mb-4 align-items-center justify-content-between g-3">
                    <div class="col-auto">
                        <h1 class="mb-0 fs-3 text-primary fw-bold">Orders Management</h1>
                        <p class="mb-0 text-secondary">Track and manage customer orders.</p>
                    </div>
                </div>

                <div class="card card-lg shadow-sm">
                    <div class="card-body p-0">
                        <div id="errorMessage" class="alert alert-danger m-4 d-none"></div>

                        <div class="table-responsive">
                            <table class="table text-nowrap mb-0 table-centered table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th class="px-4 py-3">Order ID</th>
                                        <th>Customer Info</th>
                                        <th>Delivery Address</th>
                                        <th>Payment</th>
                                        <th>Total Price</th>
                                        <th>Order Date</th>
                                        <th>Status</th>
                                        <th class="text-center">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="ordersTableBody">
                                    <tr>
                                        <td colspan="8" class="text-center py-5">
                                            <div class="spinner-border text-primary spinner-border-sm me-2"
                                                role="status"></div>
                                            Loading orders data...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module">
        import { orderService, authService } from '../services/index.js';

        const ordersTableBody = document.getElementById('ordersTableBody');
        const errorDiv = document.getElementById('errorMessage');

        document.addEventListener("DOMContentLoaded", function () {
            // Mobile Sidebar Toggle
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.querySelector('.d-lg-none');

            let overlay = document.querySelector('.sidebar-overlay');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.className = 'sidebar-overlay';
                document.body.appendChild(overlay);
            }

            if (toggleBtn && sidebar) {
                toggleBtn.addEventListener('click', function () {
                    sidebar.classList.toggle('show');
                    overlay.classList.toggle('show');
                });
            }

            overlay.addEventListener('click', function () {
                sidebar.classList.remove('show');
                overlay.classList.remove('show');
            });

            if (!authService.getAdminToken()) {
                if (errorDiv) {
                    errorDiv.innerText = "Session expired. Redirecting to login...";
                    errorDiv.classList.remove('d-none');
                }
                setTimeout(() => window.location.href = "authentication/sign-in.html", 1500);
                return;
            }
            loadOrders();
        });

        // HÀM TẢI DANH SÁCH ĐƠN HÀNG
        async function loadOrders() {
            try {
                const data = await orderService.getAllOrdersAdmin();
                const orderList = data.result ? data.result : data;

                if (Array.isArray(orderList) && orderList.length > 0) {
                    let rowsHtml = '';

                    orderList.forEach(order => {
                        let statusText = order.status ? order.status.toLowerCase() : '';
                        let statusBadge =
                            `<span class="badge bg-secondary text-white">${order.status || 'Unknown'}</span>`;

                        if (statusText.includes('dang xu ly') || statusText.includes('pending')) {
                            statusBadge = `<span class="badge bg-warning text-dark">${order.status}</span>`;
                        }
                        else if (statusText.includes('dang giao hang') || statusText.includes('shipping')) {
                            statusBadge = `<span class="badge bg-info text-white">${order.status}</span>`;
                        }
                        else if (statusText.includes('hoan thanh') || statusText.includes('completed')) {
                            statusBadge = `<span class="badge bg-success text-white">${order.status}</span>`;
                        } else if (statusText.includes('huy') || statusText.includes('canceled')) {
                            statusBadge = `<span class="badge bg-danger text-white">${order.status}</span>`;
                        }

                        let formattedDate = order.orderDate ? new Date(order.orderDate).toLocaleString('vi-VN') : 'N/A';
                        let orderId = order.idOrder || order.id;

                        rowsHtml += `
                            <tr>
                                <td class="px-4 py-3 fw-bold text-primary">#ORD-${orderId}</td>
                                <td>
                                    <div class="fw-semibold text-dark">${order.fullName || 'N/A'}</div>
                                    <small class="text-muted"><i class="ti ti-phone"></i> ${order.phone || 'N/A'}</small>
                                </td>
                                <td class="text-wrap" style="max-width: 200px;">${order.address || 'N/A'}</td>
                                <td><span class="badge bg-info text-dark">${order.payment || 'N/A'}</span></td>
                                <td class="fw-bold text-danger">$${(order.totalPrice || 0).toLocaleString('en-US')}</td>
                                <td>${formattedDate}</td>
                                <td>${statusBadge}</td>
                                <td class="text-center">
                                    <a href="orderdetail.html?id=${orderId}" class="btn btn-sm btn-outline-info" title="View Details">
                                        <i class="ti ti-eye fs-5"></i> View
                                    </a>
                                </td>
                            </tr>
                        `;
                    });

                    ordersTableBody.innerHTML = rowsHtml;
                } else {
                    ordersTableBody.innerHTML =
                        `<tr><td colspan="8" class="text-center text-secondary py-5">No orders found.</td></tr>`;
                }
            } catch (error) {
                console.error("Fetch orders error:", error);
                if (error.status === 401 || error.status === 403) {
                    ordersTableBody.innerHTML =
                        `<tr><td colspan="8" class="text-center text-danger fw-bold py-5">❌ 403 Access Denied! Token có thể đã hết hạn hoặc không có quyền.</td></tr>`;
                } else {
                    ordersTableBody.innerHTML =
                        `<tr><td colspan="8" class="text-center text-danger py-5">💥 Không thể tải danh sách đơn hàng (${error.message || 'Lỗi kết nối'}).</td></tr>`;
                }
            }
        }
    </script>
</body>

</html>
