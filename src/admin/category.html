<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category Management | Dasher</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

    <style>
        body {
            background-color: #f8f9fa;
        }

        /* Cấu trúc Layout Admin */
        #wrapper {
            display: flex;
            width: 100%;
            align-items: stretch;
            min-height: 100vh;
        }

        #sidebar {
            min-width: 250px;
            max-width: 250px;
            background: #fff;
            border-right: 1px solid #eee;
        }

        #content {
            width: 100%;
            padding-bottom: 20px;
        }

        @media (max-width: 991.98px) {
            #sidebar {
                position: fixed;
                left: -250px;
                top: 0;
                bottom: 0;
                z-index: 1045;
                height: 100vh;
                transition: left 0.3s ease;
            }
            #sidebar.show {
                left: 0;
                display: block !important;
            }
            .sidebar-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0, 0, 0, 0.4);
                z-index: 1040;
            }
            .sidebar-overlay.show {
                display: block;
            }
        }

        .card {
            border: none;
            border-radius: 0.75rem;
        }
    </style>
</head>

<body>
    <div id="wrapper">
        <nav id="sidebar" class="p-3 d-none d-lg-block shadow-sm">
            <h4 class="text-primary fw-bold mb-4">
                <a href="index.html" style="text-decoration: none; color: inherit;">Dasher.</a>
            </h4>
            <ul class="nav flex-column gap-2">
                <li class="nav-item"><a class="nav-link text-secondary" href="index.html"><i
                            class="ti ti-dashboard me-2"></i>Dashboard</a></li>
                <li class="nav-item"><a class="nav-link text-secondary" href="product.html"><i
                            class="ti ti-box me-2"></i>Products</a></li>
                <li class="nav-item"><a class="nav-link text-secondary" href="orders.html"><i
                            class="ti ti-shopping-cart me-2"></i>Orders</a></li>
                <li class="nav-item"><a class="nav-link text-dark fw-semibold" href="category.html"><i
                            class="ti ti-category me-2"></i>Categories</a></li>
                <li class="nav-item"><a class="nav-link text-secondary" href="revenue.html"><i
                            class="ti ti-chart-bar me-2"></i>Revenue</a></li>
                <li><hr class="my-2 text-secondary opacity-25"></li>
                <li class="nav-item"><a class="nav-link text-success fw-semibold d-flex align-items-center gap-1" href="../web/index.html"><i class="ti ti-arrow-left me-1"></i>Back to Shop</a></li>
            </ul>
        </nav>

        <div id="content" class="position-relative h-100">
            <header class="d-flex justify-content-between align-items-center bg-white p-3 mb-4 shadow-sm">
                <button class="btn btn-light d-lg-none"><i class="ti ti-menu-2"></i></button>
                <div class="ms-auto">
                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle d-flex align-items-center gap-2" type="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="ti ti-user-circle fs-4"></i>
                            <span class="fw-semibold">Admin Profile</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow">
                            <li>
                                <a class="dropdown-item d-flex align-items-center gap-2 text-danger" href="#"
                                    onclick="localStorage.removeItem('accessToken'); localStorage.removeItem('token'); localStorage.removeItem('idAccount'); window.location.href='authentication/sign-in.html'; return false;">
                                    <i class="ti ti-logout fs-5"></i> Logout
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </header>

            <div class="container-fluid px-4 px-lg-6 py-4">

                <div class="row mb-4 align-items-center justify-content-between g-3">
                    <div class="col-auto">
                        <h1 class="mb-0 fs-3 text-primary fw-bold">Category Management</h1>
                        <p class="mb-0 text-secondary">Manage and organize your product categories.</p>
                    </div>
                    <div class="col-auto">
                        <a href="createCategory.html" class="btn btn-primary d-flex align-items-center gap-2">
                            <i class="ti ti-plus fs-5"></i> Add New Category
                        </a>
                    </div>
                </div>

                <div class="card card-lg shadow-sm">
                    <div class="card-body p-0">
                        <div id="errorMessage" class="alert alert-danger m-4 d-none"></div>

                        <div class="table-responsive">
                            <table class="table text-nowrap mb-0 table-centered table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th class="px-4 py-3" style="width: 15%;">Category ID</th>
                                        <th style="width: 65%;">Category Name</th>
                                        <th class="text-center" style="width: 20%;">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="categoryTableBody">
                                    <tr>
                                        <td colspan="3" class="text-center py-5">
                                            <div class="spinner-border text-primary spinner-border-sm me-2"
                                                role="status"></div>
                                            Loading categories data...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module">
        import { categoryService, authService } from '../services/index.js';

        const tableBody = document.getElementById('categoryTableBody');
        const errorDiv = document.getElementById('errorMessage');

        document.addEventListener("DOMContentLoaded", function () {
            // Mobile Sidebar Toggle
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.querySelector('.d-lg-none');
            
            let overlay = document.querySelector('.sidebar-overlay');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.className = 'sidebar-overlay';
                document.body.appendChild(overlay);
            }

            if (toggleBtn && sidebar) {
                toggleBtn.addEventListener('click', function () {
                    sidebar.classList.toggle('show');
                    overlay.classList.toggle('show');
                });
            }

            overlay.addEventListener('click', function () {
                sidebar.classList.remove('show');
                overlay.classList.remove('show');
            });

            if (!authService.getAdminToken()) {
                if (errorDiv) {
                    errorDiv.innerText = "Session expired. Redirecting to login...";
                    errorDiv.classList.remove('d-none');
                }
                setTimeout(() => window.location.href = "authentication/sign-in.html", 1500);
                return;
            }
            loadCategories();
        });

        // 1. HÀM GET LẤY DANH SÁCH CATEGORIES
        async function loadCategories() {
            try {
                const data = await categoryService.getCategories();
                const cateList = data.result ? data.result : data;

                if (Array.isArray(cateList) && cateList.length > 0) {
                    let rowsHtml = '';

                    cateList.forEach(cate => {
                        let cateId = cate.idCate || cate.id; // Dự phòng biến id
                        let cateName = cate.nameCate || cate.name;

                        rowsHtml += `
                            <tr>
                                <td class="px-4 py-3 fw-bold text-primary">#CAT-${cateId}</td>
                                <td>
                                    <span class="fw-semibold text-dark fs-6">${cateName}</span>
                                </td>
                                <td class="text-center">
                                    <div class="d-flex justify-content-center gap-2">
                                        <a href="updateCategory.html?id=${cateId}" class="btn btn-sm btn-outline-warning" title="Edit Category">
                                            <i class="ti ti-edit fs-5"></i>
                                        </a>
                                        <button class="btn btn-sm btn-outline-danger btn-delete" data-id="${cateId}" title="Delete Category">
                                            <i class="ti ti-trash fs-5"></i>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        `;
                    });
                    tableBody.innerHTML = rowsHtml;
                    initDeleteEvents(); // Gán sự kiện click xóa
                } else {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="3" class="text-center text-secondary py-5">
                                No categories found in database.
                            </td>
                        </tr>`;
                }

            } catch (error) {
                console.error("Fetch API error:", error);
                if (error.status === 401 || error.status === 403) {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="3" class="text-center text-danger py-5 fw-bold">
                                ❌ 403 Access Denied: Only Admin accounts can access this page!
                            </td>
                        </tr>`;
                } else {
                    tableBody.innerHTML = `
                        <tr>
                            <td colspan="3" class="text-center text-danger py-5">
                                💥 Không thể tải danh mục (${error.message || 'Lỗi kết nối'}).
                            </td>
                        </tr>`;
                }
            }
        }

        // 2. HÀM XỬ LÝ SỰ KIỆN XÓA
        function initDeleteEvents() {
            const deleteButtons = document.querySelectorAll('.btn-delete');

            deleteButtons.forEach(button => {
                button.addEventListener('click', async function () {
                    const categoryId = this.getAttribute('data-id');

                    if (confirm(`Are you sure you want to delete Category #CAT-${categoryId}?`)) {
                        try {
                            await categoryService.deleteCategory(categoryId);
                            alert("🎉 Category deleted successfully!");
                            loadCategories(); // Tải lại bảng ngay lập tức
                        } catch (error) {
                            console.error("Error deleting category:", error);
                            alert("❌ Delete failed: " + (error.message || "An error occurred."));
                        }
                    }
                });
            });
        }
    </script>
</body>

</html>
