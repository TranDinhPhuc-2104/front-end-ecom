<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dasher Free - Bootstrap 5 Admin Dashboard (Tích hợp API)</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .bg-gradient-mixed {
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            color: #333;
        }

        .card {
            border: none;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, .075);
            border-radius: 0.75rem;
        }

        .icon-shape {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bg-warning-darker {
            background-color: #ffecd1;
        }

        .text-warning-lighter {
            color: #fd7e14;
        }

        .bg-success-darker {
            background-color: #d1f2e6;
        }

        .text-success-lighter {
            color: #198754;
        }

        .bg-info-darker {
            background-color: #cff4fc;
        }

        .text-info-lighter {
            color: #0dcaf0;
        }

        /* Cấu trúc Layout Admin */
        #wrapper {
            display: flex;
            width: 100%;
            align-items: stretch;
            min-height: 100vh;
        }

        #sidebar {
            min-width: 250px;
            max-width: 250px;
            background: #fff;
            border-right: 1px solid #eee;
        }

        #content {
            width: 100%;
            padding-bottom: 20px;
        }

        @media (max-width: 991.98px) {
            #sidebar {
                position: fixed;
                left: -250px;
                top: 0;
                bottom: 0;
                z-index: 1045;
                height: 100vh;
                transition: left 0.3s ease;
            }

            #sidebar.show {
                left: 0;
                display: block !important;
            }

            .sidebar-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0, 0, 0, 0.4);
                z-index: 1040;
            }

            .sidebar-overlay.show {
                display: block;
            }
        }
    </style>
</head>

<body>
    <div id="wrapper">
        <nav id="sidebar" class="p-3 d-none d-lg-block shadow-sm">
            <h4 class="text-primary fw-bold mb-4">
                <a href="index.html" style="text-decoration: none; color: inherit;">Dasher.</a>
            </h4>
            <ul class="nav flex-column gap-2">
                <li class="nav-item"><a class="nav-link text-dark fw-semibold" href="index.html"><i
                            class="ti ti-dashboard me-2"></i>Dashboard</a></li>
                <li class="nav-item"><a class="nav-link text-secondary" href="product.html"><i
                            class="ti ti-box me-2"></i>Products</a></li>
                <li class="nav-item"><a class="nav-link text-secondary" href="orders.html"><i
                            class="ti ti-shopping-cart me-2"></i>Orders</a></li>
                <li class="nav-item"><a class="nav-link text-secondary" href="category.html"><i
                            class="ti ti-category me-2"></i>Categories</a></li>
                <li class="nav-item"><a class="nav-link text-secondary" href="revenue.html"><i
                            class="ti ti-chart-bar me-2"></i>Revenue</a></li>
                <li>
                    <hr class="my-2 text-secondary opacity-25">
                </li>
                <li class="nav-item"><a class="nav-link text-success fw-semibold d-flex align-items-center gap-1"
                        href="../web/index.html"><i class="ti ti-arrow-left me-1"></i>Back to Shop</a></li>
            </ul>
        </nav>

        <div id="content" class="position-relative h-100">
            <header class="d-flex justify-content-between align-items-center mb-4 bg-white p-3 shadow-sm">
                <button class="btn btn-light d-lg-none"><i class="ti ti-menu-2"></i></button>
                <div class="ms-auto d-flex align-items-center gap-3">
                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle d-flex align-items-center gap-2" type="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="ti ti-user-circle fs-4"></i>
                            <span class="fw-semibold">Admin Profile</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow">
                            <li>
                                <a class="dropdown-item d-flex align-items-center gap-2" href="../web/index.html">
                                    <i class="ti ti-store fs-5"></i> Back to Shop
                                </a>
                            </li>
                            <li>
                                <hr class="dropdown-divider">
                            </li>
                            <li>
                                <a class="dropdown-item d-flex align-items-center gap-2 text-danger" href="#"
                                    onclick="localStorage.removeItem('accessToken'); localStorage.removeItem('token'); localStorage.removeItem('idAccount'); window.location.href='authentication/sign-in.html'; return false;">
                                    <i class="ti ti-logout fs-5"></i> Logout
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </header>

            <div class="container-fluid px-4 px-lg-6 py-4">
                <div class="row mb-4 g-4">
                    <div class="col-xl-4 col-lg-6">
                        <div class="card card-lg h-100">

                        </div>
                    </div>
                </div>

                <div class="row row-cols-1 row-cols-md-3 mb-4 g-4">
                    <div class="col">
                        <div class="card card-lg h-100">
                            <div class="card-body d-flex flex-column gap-3">
                                <div class="d-flex align-items-center gap-3">
                                    <div class="icon-shape rounded-circle bg-warning-darker text-warning-lighter">
                                        <i class="ti ti-shopping-cart fs-2"></i>
                                    </div>
                                    <div class="fw-semibold">Orders</div>
                                </div>
                                <div class="d-flex justify-content-between align-items-center">
                                    <div class="fs-3 fw-bold" id="totalOrdersCount">-</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col">
                        <div class="card card-lg h-100">
                            <div class="card-body d-flex flex-column gap-3">
                                <div class="d-flex align-items-center gap-3">
                                    <div class="icon-shape rounded-circle bg-success-darker text-success-lighter">
                                        <i class="ti ti-coin fs-2"></i>
                                    </div>
                                    <div class="fw-semibold">Revenue</div>
                                </div>
                                <div class="d-flex justify-content-between align-items-center">
                                    <div class="fs-3 fw-bold" id="totalRevenue">-</div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row">
                    <div class="col-12">
                        <div class="card card-lg">
                            <div class="card-header bg-white border-bottom-0 pt-4 pb-0">
                                <h5 class="mb-0 fw-bold">Recent Orders (API Integration)</h5>
                            </div>
                            <div class="card-body">
                                <div class="table-responsive">
                                    <table class="table text-nowrap mb-0 table-hover align-middle">
                                        <thead class="table-light">
                                            <tr>
                                                <th>Order ID</th>
                                                <th>Amount</th>
                                                <th>Payment Method</th>
                                                <th>Order Date</th>
                                                <th>Status</th>
                                                <th>Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody id="dashboardOrdersTableBody">
                                            <tr>
                                                <td colspan="6" class="text-center py-4">
                                                    <div class="spinner-border text-primary spinner-border-sm me-2">
                                                    </div> Đang tải dữ liệu đơn hàng...
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.js"></script>

    <script type="module">
        import { orderService } from '../services/index.js';

        document.addEventListener("DOMContentLoaded", function () {
            // Mobile Sidebar Toggle
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.querySelector('.d-lg-none');

            let overlay = document.querySelector('.sidebar-overlay');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.className = 'sidebar-overlay';
                document.body.appendChild(overlay);
            }

            if (toggleBtn && sidebar) {
                toggleBtn.addEventListener('click', function () {
                    sidebar.classList.toggle('show');
                    overlay.classList.toggle('show');
                });
            }

            overlay.addEventListener('click', function () {
                sidebar.classList.remove('show');
                overlay.classList.remove('show');
            });

            // Khởi tạo Swiper
            new Swiper('#swiper-1', {
                loop: true,
                pagination: {
                    el: '.swiper-pagination',
                    clickable: true
                },
            });

            countTotalOrders();
            fetchDashboardOrders();
        });

        async function countTotalOrders() {
            try {
                const data = await orderService.getAllOrdersAdmin();
                const countElement = document.getElementById('totalOrdersCount');
                const revenueElement = document.getElementById('totalRevenue');

                if (data.result && Array.isArray(data.result)) {
                    countElement.innerText = data.result.length;

                    // Calculate total revenue from all orders with "Hoan thanh" or "Completed" status
                    let totalRevenue = 0;
                    data.result.forEach(order => {
                        const statusText = (order.status || '').toLowerCase();
                        if (statusText.includes('hoan thanh') || statusText.includes('completed')) {
                            totalRevenue += order.totalPrice || order.total_price || 0;
                        }
                    });

                    if (revenueElement) {
                        revenueElement.innerText = '$' + totalRevenue.toLocaleString('en-US');
                    }
                } else {
                    countElement.innerText = '0';
                    if (revenueElement) {
                        revenueElement.innerText = '$0';
                    }
                }
            } catch (error) {
                console.error("Lỗi khi đếm đơn hàng và tính doanh thu:", error);
                document.getElementById('totalOrdersCount').innerText = '!';
                const revenueElement = document.getElementById('totalRevenue');
                if (revenueElement) {
                    revenueElement.innerText = '!';
                }
            }
        }

        async function fetchDashboardOrders() {
            const tbody = document.getElementById('dashboardOrdersTableBody');
            try {
                const data = await orderService.getAllOrdersAdmin();

                if (data.result && data.result.length > 0) {
                    const recentOrders = [...data.result].reverse().slice(0, 5);
                    let rowsHtml = '';

                    recentOrders.forEach(order => {
                        let statusText = (order.status || '').toLowerCase();
                        let badgeClass = 'bg-secondary text-white';

                        if (statusText.includes('dang xu ly') || statusText.includes('pending'))
                            badgeClass = 'bg-warning text-dark';
                        else if (statusText.includes('hoan thanh') || statusText.includes('completed'))
                            badgeClass = 'bg-success text-white';
                        else if (statusText.includes('huy') || statusText.includes('canceled'))
                            badgeClass = 'bg-danger text-white';

                        let displayId = order.idOrder || order.id || '---';
                        let amount = order.totalPrice || order.total_price || 0;
                        let payment = order.payment || 'Standard';
                        let date = order.orderDate ? new Date(order.orderDate).toLocaleDateString('vi-VN') : 'N/A';

                        rowsHtml += `
                            <tr>
                                <td class="fw-semibold">#ORD-${displayId}</td>
                                <td class="text-danger fw-bold">$${amount.toLocaleString('en-US')}</td>
                                <td>${payment}</td>
                                <td>${date}</td>
                                <td><span class="badge ${badgeClass}">${order.status || 'N/A'}</span></td>
                                <td>
                                    <a href="orderdetail.html?id=${displayId}" class="btn btn-outline-primary btn-sm">View</a>
                                </td>
                            </tr>
                        `;
                    });

                    tbody.innerHTML = rowsHtml;
                } else {
                    tbody.innerHTML =
                        `<tr><td colspan="6" class="text-center text-muted py-4">Chưa có đơn hàng nào.</td></tr>`;
                }
            } catch (error) {
                console.error("Lỗi fetch đơn hàng Dashboard:", error);
                if (tbody) {
                    tbody.innerHTML =
                        `<tr><td colspan="6" class="text-center text-danger py-4">Lỗi kết nối máy chủ! (${error.message || 'Token có thể đã hết hạn'})</td></tr>`;
                }
            }
        }
    </script>
</body>

</html>
