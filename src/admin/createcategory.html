<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Category | Dasher</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

    <style>
        body {
            background-color: #f8f9fa;
        }

        /* Cấu trúc Layout Admin */
        #wrapper {
            display: flex;
            width: 100%;
            align-items: stretch;
            min-height: 100vh;
        }

        #sidebar {
            min-width: 250px;
            max-width: 250px;
            background: #fff;
            border-right: 1px solid #eee;
        }

        #content {
            width: 100%;
            padding-bottom: 20px;
        }

        @media (max-width: 991.98px) {
            #sidebar {
                position: fixed;
                left: -250px;
                top: 0;
                bottom: 0;
                z-index: 1045;
                height: 100vh;
                transition: left 0.3s ease;
            }
            #sidebar.show {
                left: 0;
                display: block !important;
            }
            .sidebar-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0, 0, 0, 0.4);
                z-index: 1040;
            }
            .sidebar-overlay.show {
                display: block;
            }
        }

        .card {
            border: none;
            border-radius: 0.75rem;
        }
    </style>
</head>

<body>
    <div id="wrapper">
        <nav id="sidebar" class="p-3 d-none d-lg-block shadow-sm">
            <h4 class="text-primary fw-bold mb-4">
                <a href="index.html" style="text-decoration: none; color: inherit;">Dasher.</a>
            </h4>
            <ul class="nav flex-column gap-2">
                <li class="nav-item"><a class="nav-link text-secondary" href="index.html"><i
                            class="ti ti-dashboard me-2"></i>Dashboard</a></li>
                <li class="nav-item"><a class="nav-link text-secondary" href="product.html"><i
                            class="ti ti-box me-2"></i>Products</a></li>
                <li class="nav-item"><a class="nav-link text-secondary" href="orders.html"><i
                            class="ti ti-shopping-cart me-2"></i>Orders</a></li>
                <li class="nav-item"><a class="nav-link text-dark fw-semibold" href="category.html"><i
                            class="ti ti-category me-2"></i>Categories</a></li>
                <li class="nav-item"><a class="nav-link text-secondary" href="revenue.html"><i
                            class="ti ti-chart-bar me-2"></i>Revenue</a></li>
                <li><hr class="my-2 text-secondary opacity-25"></li>
                <li class="nav-item"><a class="nav-link text-success fw-semibold d-flex align-items-center gap-1" href="../web/index.html"><i class="ti ti-arrow-left me-1"></i>Back to Shop</a></li>
            </ul>
        </nav>

        <div id="content" class="position-relative h-100">
            <header class="d-flex justify-content-between align-items-center bg-white p-3 mb-4 shadow-sm">
                <button class="btn btn-light d-lg-none"><i class="ti ti-menu-2"></i></button>
                <div class="ms-auto">
                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle d-flex align-items-center gap-2" type="button"
                            data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="ti ti-user-circle fs-4"></i>
                            <span class="fw-semibold">Admin Profile</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow">
                            <li>
                                <a class="dropdown-item d-flex align-items-center gap-2 text-danger" href="#"
                                    onclick="localStorage.removeItem('accessToken'); localStorage.removeItem('token'); localStorage.removeItem('idAccount'); window.location.href='authentication/sign-in.html'; return false;">
                                    <i class="ti ti-logout fs-5"></i> Logout
                                </a>
                            </li>
                        </ul>
                    </div>
                </div>
            </header>

            <div class="container-fluid px-4 px-lg-6 py-4">

                <div class="row mb-4 align-items-center g-3">
                    <div class="col-auto">
                        <h1 class="mb-0 fs-3 text-primary fw-bold">Add New Category</h1>
                        <p class="mb-0 text-secondary">Create a new category to organize your products.</p>
                    </div>
                </div>

                <div class="row justify-content-center">
                    <div class="col-xl-6 col-lg-8 col-12">
                        <div class="card card-lg shadow-sm mb-4">
                            <div class="card-body p-4 p-md-5">

                                <div id="responseMessage" class="alert d-none mb-4"></div>

                                <form id="createCategoryForm" class="needs-validation" novalidate>
                                    <div class="row g-4">

                                        <div class="col-md-12">
                                            <label for="categoryName" class="form-label fw-semibold">Category Name <span
                                                    class="text-danger">*</span></label>
                                            <input type="text" class="form-control" id="categoryName"
                                                placeholder="Enter category name (e.g., Laptops, Smartphones)"
                                                required />
                                            <div class="invalid-feedback">Please enter a category name.</div>
                                        </div>

                                        <div class="col-md-12 d-flex gap-3 justify-content-end mt-4">
                                            <a href="category.html" class="btn btn-light border">Cancel</a>
                                            <button type="submit" id="btnSubmit"
                                                class="btn btn-primary d-flex align-items-center gap-2">
                                                <i class="ti ti-device-floppy fs-5"></i> Save Category
                                            </button>
                                        </div>

                                    </div>
                                </form>

                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module">
        import { categoryService, authService } from '../services/index.js';

        document.addEventListener("DOMContentLoaded", function () {
            // Mobile Sidebar Toggle
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.querySelector('.d-lg-none');
            
            let overlay = document.querySelector('.sidebar-overlay');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.className = 'sidebar-overlay';
                document.body.appendChild(overlay);
            }

            if (toggleBtn && sidebar) {
                toggleBtn.addEventListener('click', function () {
                    sidebar.classList.toggle('show');
                    overlay.classList.toggle('show');
                });
            }

            overlay.addEventListener('click', function () {
                sidebar.classList.remove('show');
                overlay.classList.remove('show');
            });

            // Kiểm tra Token cảnh báo
            if (!authService.getAdminToken()) {
                const messageDiv = document.getElementById('responseMessage');
                if (messageDiv) {
                    messageDiv.className = "alert alert-warning d-block mb-4";
                    messageDiv.innerText = "Warning: No access token found. API calls may fail.";
                }
            }
        });

        document.getElementById('createCategoryForm').addEventListener('submit', async function (event) {
            event.preventDefault();
            event.stopPropagation();

            const form = this;
            const messageDiv = document.getElementById('responseMessage');
            const btnSubmit = document.getElementById('btnSubmit');

            // Kiểm tra validation phía giao diện (HTML5)
            if (!form.checkValidity()) {
                form.classList.add('was-validated');
                return;
            }
            form.classList.add('was-validated');

            // Lấy dữ liệu và loại bỏ khoảng trắng dư thừa
            const categoryNameValue = document.getElementById('categoryName').value.trim();

            if (!categoryNameValue) {
                messageDiv.className = "alert alert-danger d-block mb-4";
                messageDiv.innerText = "Category name cannot be just spaces.";
                return;
            }

            // Ẩn thông báo cũ và hiển thị trạng thái đang xử lý
            messageDiv.className = "alert d-none mb-4";
            btnSubmit.disabled = true;
            btnSubmit.innerHTML =
                `<span class="spinner-border spinner-border-sm" role="status"></span> Saving...`;

            // Cấu trúc Payload gửi lên API
            const requestData = {
                nameCate: categoryNameValue
            };

            try {
                await categoryService.createCategory(requestData);

                messageDiv.className = "alert alert-success d-block mb-4";
                messageDiv.innerText = "🎉 Category created successfully! Redirecting...";

                form.reset();
                form.classList.remove('was-validated');

                // Quay về trang danh sách sau 1.5 giây
                setTimeout(() => {
                    window.location.href = "category.html";
                }, 1500);

            } catch (error) {
                console.error("Error creating category:", error);
                messageDiv.className = "alert alert-danger d-block mb-4";
                messageDiv.innerText = "❌ Failed: " + (error.message || "Cannot create category. It might already exist.");

                btnSubmit.disabled = false;
                btnSubmit.innerHTML = `<i class="ti ti-device-floppy fs-5"></i> Save Category`;
            }
        });
    </script>
</body>

</html>
