<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Revenue Dashboard | Dasher</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

    <style>
        body {
            background-color: #f8f9fa;
        }

        #wrapper {
            display: flex;
            width: 100%;
            align-items: stretch;
            min-height: 100vh;
        }

        #sidebar {
            min-width: 250px;
            max-width: 250px;
            background: #fff;
            border-right: 1px solid #eee;
        }

        #content {
            width: 100%;
            padding-bottom: 20px;
        }

        @media (max-width: 991.98px) {
            #sidebar {
                position: fixed;
                left: -250px;
                top: 0;
                bottom: 0;
                z-index: 1045;
                height: 100vh;
                transition: left 0.3s ease;
            }
            #sidebar.show {
                left: 0;
                display: block !important;
            }
            .sidebar-overlay {
                display: none;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: rgba(0, 0, 0, 0.4);
                z-index: 1040;
            }
            .sidebar-overlay.show {
                display: block;
            }
        }

        .card {
            border: none;
            border-radius: 0.75rem;
        }
    </style>
</head>

<body>
    <div id="wrapper">
        <nav id="sidebar" class="p-3 d-none d-lg-block shadow-sm">
            <h4 class="text-primary fw-bold mb-4">
                <a href="index.html" style="text-decoration: none; color: inherit;">Dasher.</a>
            </h4>
            <ul class="nav flex-column gap-2">
                <li class="nav-item"><a class="nav-link text-secondary" href="index.html"><i
                            class="ti ti-dashboard me-2"></i>Dashboard</a></li>
                <li class="nav-item"><a class="nav-link text-secondary" href="product.html"><i
                            class="ti ti-box me-2"></i>Products</a></li>
                <li class="nav-item"><a class="nav-link text-secondary" href="orders.html"><i
                            class="ti ti-shopping-cart me-2"></i>Orders</a></li>
                <li class="nav-item"><a class="nav-link text-secondary" href="category.html"><i
                            class="ti ti-category me-2"></i>Categories</a></li>
                <li class="nav-item"><a class="nav-link text-dark fw-semibold" href="revenue.html"><i
                            class="ti ti-chart-bar me-2"></i>Revenue</a></li>
                <li><hr class="my-2 text-secondary opacity-25"></li>
                <li class="nav-item"><a class="nav-link text-success fw-semibold d-flex align-items-center gap-1" href="../web/index.html"><i class="ti ti-arrow-left me-1"></i>Back to Shop</a></li>
            </ul>
        </nav>

        <div id="content" class="position-relative h-100">
            <header class="d-flex justify-content-between align-items-center bg-white p-3 mb-4 shadow-sm">
                <button class="btn btn-light d-lg-none"><i class="ti ti-menu-2"></i></button>
                <div class="ms-auto">
                    <div class="dropdown">
                        <button class="btn btn-light dropdown-toggle d-flex align-items-center gap-2" type="button"
                            data-bs-toggle="dropdown">
                            <i class="ti ti-user-circle fs-4"></i><span class="fw-semibold">Admin Profile</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end shadow">
                            <li><a class="dropdown-item d-flex align-items-center gap-2 text-danger" href="#"
                                    onclick="localStorage.clear(); window.location.href='authentication/sign-in.html'; return false;"><i
                                        class="ti ti-logout fs-5"></i> Logout</a></li>
                        </ul>
                    </div>
                </div>
            </header>

            <div class="container-fluid px-4 px-lg-6 py-4">
                <div class="row mb-4 align-items-center justify-content-between g-3">
                    <div class="col-auto">
                        <h1 class="mb-0 fs-3 text-primary fw-bold">Revenue Overview</h1>
                        <p class="mb-0 text-secondary">Theo dõi doanh thu cửa hàng theo ngày, tháng, năm.</p>
                    </div>
                    <div class="col-auto d-flex align-items-center gap-2 bg-white p-2 rounded shadow-sm">
                        <label for="filterType" class="fw-bold text-dark mb-0 small">Xem theo:</label>
                        <select id="filterType"
                            class="form-select form-select-sm w-auto border-0 fw-semibold text-primary">
                            <option value="date" selected>Ngày cụ thể</option>
                            <option value="month">Tháng chọn</option>
                            <option value="year">Năm chọn</option>
                        </select>
                        <div class="vr mx-1"></div>
                        <input type="date" id="datePicker" class="form-control form-control-sm w-auto border-0" />
                    </div>
                </div>

                <div id="errorMessage" class="alert alert-danger d-none mb-4"></div>

                <div class="row g-4 mb-4">
                    <div class="col-md-4">
                        <div class="card h-100 shadow-sm border-start border-primary border-4">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <p class="text-muted mb-1 fw-semibold small text-uppercase">Doanh Thu (Ngày
                                            Chọn)</p>
                                        <h3 class="fw-bold text-dark mb-0" id="dailyRev">...</h3>
                                    </div>
                                    <div class="bg-primary-subtle text-primary p-3 rounded-circle"><i
                                            class="ti ti-currency-dollar fs-3"></i></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card h-100 shadow-sm border-start border-success border-4">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <p class="text-muted mb-1 fw-semibold small text-uppercase">Doanh Thu (Tháng
                                            Chọn)</p>
                                        <h3 class="fw-bold text-dark mb-0" id="monthlyRev">...</h3>
                                    </div>
                                    <div class="bg-success-subtle text-success p-3 rounded-circle"><i
                                            class="ti ti-calendar-stats fs-3"></i></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card h-100 shadow-sm border-start border-warning border-4">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div>
                                        <p class="text-muted mb-1 fw-semibold small text-uppercase">Doanh Thu (Năm Chọn)
                                        </p>
                                        <h3 class="fw-bold text-dark mb-0" id="yearlyRev">...</h3>
                                    </div>
                                    <div class="bg-warning-subtle text-warning p-3 rounded-circle"><i
                                            class="ti ti-chart-line fs-3"></i></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card shadow-sm">
                    <div class="card-header bg-white py-3">
                        <h5 class="mb-0 fw-bold">
                            <i class="ti ti-chart-bar text-primary me-2"></i>
                            <span id="chartTitle">Biểu đồ Doanh Thu</span>
                        </h5>
                    </div>
                    <div class="card-body">
                        <div style="position: relative; height: 400px; width: 100%;">
                            <canvas id="revenueChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script type="module">
        import { revenueService, authService } from '../services/index.js';

        const errorDiv = document.getElementById('errorMessage');
        let myChart = null;

        document.addEventListener("DOMContentLoaded", function () {
            // Mobile Sidebar Toggle
            const sidebar = document.getElementById('sidebar');
            const toggleBtn = document.querySelector('.d-lg-none');
            
            let overlay = document.querySelector('.sidebar-overlay');
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.className = 'sidebar-overlay';
                document.body.appendChild(overlay);
            }

            if (toggleBtn && sidebar) {
                toggleBtn.addEventListener('click', function () {
                    sidebar.classList.toggle('show');
                    overlay.classList.toggle('show');
                });
            }

            overlay.addEventListener('click', function () {
                sidebar.classList.remove('show');
                overlay.classList.remove('show');
            });

            if (!authService.getAdminToken()) {
                errorDiv.innerText = "Session expired. API calls will fail.";
                errorDiv.classList.remove('d-none');
            }

            const datePicker = document.getElementById('datePicker');
            const filterType = document.getElementById('filterType');

            const today = new Date();
            const todayFormatted = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;
            datePicker.value = todayFormatted;

            // Load dữ liệu mặc định ban đầu
            fetchRevenueData(todayFormatted, filterType.value);

            // Bắt sự kiện đổi ngày
            datePicker.addEventListener('change', function () {
                if (this.value) fetchRevenueData(this.value, filterType.value);
            });

            // Bắt sự kiện đổi kiểu xem (Ngày / Tháng / Năm)
            filterType.addEventListener('change', function () {
                if (datePicker.value) fetchRevenueData(datePicker.value, this.value);
            });
        });

        async function fetchRevenueData(dateString, type) {
            try {
                errorDiv.classList.add('d-none');
                document.getElementById('dailyRev').innerText = "Loading...";
                document.getElementById('monthlyRev').innerText = "Loading...";
                document.getElementById('yearlyRev').innerText = "Loading...";

                const data = await revenueService.getRevenue(dateString, type);

                if (data && data.result) {
                    const result = data.result;

                    document.getElementById('dailyRev').innerText = `$${(result.dailyRevenue || 0).toLocaleString('en-US')}`;
                    document.getElementById('monthlyRev').innerText = `$${(result.monthlyRevenue || 0).toLocaleString('en-US')}`;
                    document.getElementById('yearlyRev').innerText = `$${(result.yearlyRevenue || 0).toLocaleString('en-US')}`;

                    const chartDataArray = result.chartData || [];
                    const chartLabels = chartDataArray.map(item => item.date || 'N/A');
                    const chartRevenues = chartDataArray.map(item => item.revenue || 0);

                    // CẬP NHẬT: Đổi tiêu đề biểu đồ linh động theo bộ lọc hiện tại
                    const titleMapping = {
                        'date': 'Biểu đồ Doanh Thu 7 Ngày Gần Nhất',
                        'month': 'Biểu đồ Chi Tiết Các Ngày Trong Tháng',
                        'year': 'Biểu đồ Doanh Thu 12 Tháng Trong Năm'
                    };
                    document.getElementById('chartTitle').innerText = titleMapping[type] || 'Biểu đồ Doanh Thu';

                    drawChart(chartLabels, chartRevenues);
                } else {
                    throw new Error(data?.message || "Failed to load data.");
                }
            } catch (error) {
                console.error(error);
                errorDiv.innerText = `Error: ${error.message}`;
                errorDiv.classList.remove('d-none');
                document.getElementById('dailyRev').innerText = "$0";
                document.getElementById('monthlyRev').innerText = "$0";
                document.getElementById('yearlyRev').innerText = "$0";
                drawChart([], []);
            }
        }

        // Hàm vẽ biểu đồ (Giữ nguyên logic Chart.js tối ưu cũ của bạn)
        function drawChart(labels, data) {
            const canvasElement = document.getElementById('revenueChart');
            if (!canvasElement) return;
            const ctx = canvasElement.getContext('2d');

            if (myChart !== null) {
                myChart.destroy();
            }

            const displayLabels = labels.length > 0 ? labels : ['No Data'];
            const displayData = data.length > 0 ? data : [0];

            myChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: displayLabels,
                    datasets: [{
                        label: 'Doanh thu ($)',
                        data: displayData,
                        backgroundColor: 'rgba(54, 162, 235, 0.6)',
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 1,
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { callback: function (value) { return '$' + value; } }
                        }
                    }
                }
            });
        }
    </script>
</body>

</html>
